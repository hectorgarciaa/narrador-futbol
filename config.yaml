# Configuracion del sistema de narracion de futbol con IA

# Rutas de archivos y directorios (relativas a la raiz del proyecto)
paths:
  # Modelos YOLO
  models:
    yolo_base: "models/yolo/v11/yolo11m.pt"

    yolo_v8_m: "models/yolo/v8/yolov8m.pt"
    yolo_v8_l: "models/yolo/v8/yolov8l.pt"
    yolo_v8_x: "models/yolo/v8/yolov8x.pt"

    yolo_v11_m: "models/yolo/v11/yolo11m.pt"
    yolo_v11_l: "models/yolo/v11/yolo11l.pt"
    yolo_v11_x: "models/yolo/v11/yolo11x.pt"

    modelo_base: "models/finetuning/yolov11m/weights/best.pt"
    finetuned_player: "models/finetuning/con_arbitro/dfl-bundesliga/weights/best.pt"
    finetuned_ball: "models/finetuning-balon/v11/yolo11m/weights/best.pt"

  # Datos
  data:
    video_prueba: "data/partidoPrueba/partido.mp4"
    video_prueba_ajustado: "data/partidoPrueba/partido_ajustado.mp4"
    video_prueba_corto: "data/partidoPrueba/partido_corto.mp4"
    video_prueba_medio: "data/partidoPrueba/partido_medio.mp4"

    clasico: "data/partidoPrueba/clasico.mp4"
    clasico_30s: "data/partidoPrueba/clasico_4-5.mp4"

    ferro: "data/partidoPrueba/ferro.mp4"
    ferro_30s: "data/partidoPrueba/ferro_2-3.mp4"

    ucl: "data/partidoPrueba/ucl_final.mp4"
    ucl_30s: "data/partidoPrueba/ucl_final_5-5.mp4"
    ucl_5m: "data/partidoPrueba/ucl_final_2-10.mp4"

    # Clips para dataset de posiciones (data/partidosPosiciones)
    video_test_1: "data/partidosPosiciones/test (1).mp4"
    video_test_2: "data/partidosPosiciones/test (2).mp4"
    video_test_11: "data/partidosPosiciones/test (11).mp4"
    video_test_12: "data/partidosPosiciones/test (12).mp4"
    video_test_13: "data/partidosPosiciones/test (13).mp4"
    video_test_14: "data/partidosPosiciones/test (14).mp4"
    video_test_15: "data/partidosPosiciones/test (15).mp4"
    video_test_16: "data/partidosPosiciones/test (16).mp4"
    video_test_18: "data/partidosPosiciones/test (18).mp4"
    video_test_20: "data/partidosPosiciones/test (20).mp4"
    video_test_22: "data/partidosPosiciones/test (22).mp4"
    video_test_26: "data/partidosPosiciones/test (26).mp4"
    video_test_27: "data/partidosPosiciones/test (27).mp4"
    video_test_29: "data/partidosPosiciones/test (29).mp4"

    dataset_football_ai: "data/detection/football-ai-2/data.yaml"
    dataset_football_detection: "data/detection/FootBall-Detection-2/data.yaml"
    dataset_soccersynth: "data/detection/SoccerSynth/data.yaml"
    dataset_football_dfl: "data/detection/DFL-Bundesliga,-soccer,-football-1/data.yaml"
    dataset_football_dfl_2clases: "data/detection/DFL-Bundesliga-2clases/data.yaml"
    dataset_soccersynth_2clases: "data/detection/SoccerSynth_YOLO_2clases/data.yaml"

    download_detection_output: "data/detection"

  # Modelos descargados
  models_download:
    base_dir: "models/yolo"
    versions:
      v8: ["yolov8m"]
      v11: ["yolo11m"]

  # Salidas
  output:
    base: "output"
    videos: "output/videos"
    tracks_json: "output/tracks_json"
    role_artifacts: "output/tracker"
    prueba_tracker: "output/pruebaTracker"
    prueba_deteccion_yolo: "output/pruebaDeteccionYolo"
    prueba_finetuning: "output/pruebaFinetuning"

# Configuracion de deteccion
detection:
  conf: 0.01
  verbose: true

# Configuracion de clustering de colores
team_detector:
  team_color_model_conf:
    min_samples: {"player": 60, "referee": 15}
    min_size_cluster: 15
    min_conf: {"player": 0.8, "referee": 0.7}
    max_samples_per_class: 500
    referee_bootstrap_margin: 10
    referee_upper_bound_cap: 20.0
    allow_referee_bootstrap_sampling_from_outfield: false
  shirt_detector_conf:
    pixels_resize: 1536
    batched_kmeans_gpu_conf:
      n_clusters: 2
      n_init: 1
      use_gpu: true
      random_state: 0

# Configuracion general de tracking/orquestacion
tracking:
  execution_mode: runtime
  lineup_spec:
    teams:
      - formation: "4-3-3"
        pitch_layout:
          DC: {x: 50, y: 14}
          DFC_DER: {x: 62, y: 72}
          DFC_IZQ: {x: 38, y: 72}
          ED: {x: 80, y: 20}
          EI: {x: 20, y: 20}
          LD: {x: 82, y: 72}
          LI: {x: 18, y: 72}
          MC: {x: 50, y: 44}
          MD: {x: 72, y: 48}
          MI: {x: 28, y: 48}
          POR: {x: 50, y: 90}
        players_by_slot:
          DC: "Benzema"
          DFC_DER: "Alaba"
          DFC_IZQ: "Militao"
          ED: "Rodrygo"
          EI: "Vinicius"
          LD: "Carvajal"
          LI: "Mendy"
          MC: "Casemiro"
          MD: "Valverde"
          MI: "Bellingham"
          POR: "Courtois"
        team_color: "#ffffff"
        team_name: "Real Madrid"
        tracking_slots: ["POR", "LD", "LI", "DFC_DER", "DFC_IZQ", "MC", "MI", "MD", "EI", "DC", "ED"]
        ui_slots: ["POR", "LD", "LI", "DFC_DER", "DFC_IZQ", "MC", "MI", "MD", "EI", "DC", "ED"]
      - formation: "4-3-3"
        pitch_layout:
          DC: {x: 50, y: 14}
          DFC_DER: {x: 62, y: 72}
          DFC_IZQ: {x: 38, y: 72}
          ED: {x: 80, y: 20}
          EI: {x: 20, y: 20}
          LD: {x: 82, y: 72}
          LI: {x: 18, y: 72}
          MC: {x: 50, y: 44}
          MD: {x: 72, y: 48}
          MI: {x: 28, y: 48}
          POR: {x: 50, y: 90}
        players_by_slot:
          DC: "Villa"
          EI: "Neymar"
          DFC_DER: "Pique"
          DFC_IZQ: "Puyol"
          ED: "Messi"
          MI: "Pedri"
          LD: "Alves"
          LI: "Cancelo"
          MD: "Iniesta"
          MC: "Busquets"
          POR: "Valdes"
        team_color: "#A5FF6E"
        team_name: "Wolfsburgo"
        tracking_slots: ["POR", "LD", "LI", "DFC_DER", "DFC_IZQ", "MC", "MI", "MD", "EI", "DC", "ED"]
        ui_slots: ["POR", "LD", "LI", "DFC_DER", "DFC_IZQ", "MC", "MI", "MD", "EI", "DC", "ED"]
    video_source: "video_prueba"
  print_runtime_devices: true

projector:
  enabled: true
  constructor:
    max_width: 1280
    bottom_offset_ratio: 0.04
    keypoint_threshold: 0.30
    line_threshold: 0.60
    pnl_refine: false
    temporal_blend: 0.20
    adaptive_thresholds_enabled: true
    adaptive_max_attempts: 4
    adaptive_keypoint_threshold_step: 0.02
    adaptive_line_threshold_step: 0.05
    adaptive_keypoint_threshold_min: 0.28
    adaptive_line_threshold_min: 0.55
    device: null
    projection_quality_analyzer_conf:
      min_visible_keypoints: 7
      min_visible_lines: 1
      validation_score_threshold: 0.56
      validation_geometry_fit_min: 0.38
      validation_support_quality_min: 0.31
      validation_coverage_quality_min: 0.18
      validation_reprojection_error_threshold_px: 8.0
      validation_homography_condition_number_threshold: 100000000.0
      validation_keypoint_world_error_threshold_m: 3.0
      validation_line_world_error_threshold_m: 4.0
      validation_target_visible_keypoints: 9
      validation_target_visible_lines: 4
      validation_target_image_point_hull_area_ratio: 0.18
      validation_target_image_x_span_ratio: 0.55
      validation_target_image_y_span_ratio: 0.40
      validation_target_field_coverage_ratio: 0.20

bytetracker:
  track_activation_threshold: 0.10
  low_conf_threshold: 0.01
  lost_track_buffer: 90
  minimum_matching_threshold: 0.945
  minimum_consecutive_frames: 5
  new_track_active_overlap_iou: 0.2
  new_track_unconfirmed_overlap_iou: 0.1
  new_track_candidate_overlap_iou: 0.0
  second_match_threshold: 0.9
  unconfirmed_match_threshold: 0.9
  field_position_classes: ["player", "goalkeeper"]
  field_distance_gate_m: 8.0
  field_distance_gate_max_lost_frames: 10
  field_distance_gate_cap_m: 8.0
  field_distance_decay_per_frame: 0.3
  lost_time_penalty_weight: 0.12
  lost_time_penalty_max_frames: 10
  bbox_center_distance_gate_px: 90.0
  bbox_center_distance_gate_max_lost_frames: 4
  bbox_center_distance_gate_cap_px: 360.0
  class_vote_weight_relabel: 1.0
  class_vote_weight_yolo: 1.0
  class_consensus_switch_margin: 2.0
  bbox_height_ratio_threshold: 0.50
  bbox_width_ratio_threshold: 1
  team_vote_weight: 1.0
  team_consensus_switch_margin: 2.0

posession:
  enabled: true
  strict_control_distance_px: 60.0

actions:
  enabled: true
  mode: rolling
  fps: 25.0
  cadence_frames: 40
  min_frames_warmup: 50
  min_event_duration: 10
  emit_delay_frames: 50
  emit_frames: 40
  sample_freq: 5
  window_seconds: 10.0
  repo_path: external/pathcrf
  trial: 120
  model_file: state_dict_best_acc.pt
  device: auto
  use_crf: true
  decode: indep
  snapshot_window_frames: 750
  async_enabled: true
  max_workers: 1
  drop_policy: latest
  smooth_edges: false
  export_debug: false
  postprocess:
    min_support_frames: 5
    min_consecutive_frames: 3
    min_support_ratio: 0.15
    allow_multiple_events_per_emit: false
    deduplicate_events: true
    hysteresis_margin: 0.10

commentary:
  enabled: true
  generate_text: true
  generate_audio: true
  llm_model: "gemma4-q4ks-text"
  llm_base_url: null
  llm_temperature: 0.7
  tts_backend: "xtts"
  speaker_wavs: []
  female_speaker_wavs: []
  alternate_voices: False
  max_workers: 2
  drop_policy: "latest"
  max_queue_size: 8
  skip_event_types: ["out", "unknown"]
  deduplicate_consecutive: true

canonical:
  max_tracks_per_class:
    goalkeeper: 2
    player: 20
    ball: 1
    referee: 3
  field_position_classes: ["player", "goalkeeper"]
  field_distance_gate_m: 2.1
  field_distance_gate_max_lost_frames: 10
  field_distance_gate_cap_m: 8.0
  field_distance_decay_per_frame: 0.3
  reassign_motion_factor: 0.75
  reassign_min_distance: 10.0
  reassign_min_samples: 3
  reassign_motion_growth_cap_frames: 12
  referee_sideline_band_distance_m: 3.0
  strict_person_class_separation: true
  forced_absorption_player_min_lost_frames: 20
  forced_absorption_player_min_consistent_frames: 10
  reserve_penalty_spot_seed_players: true
  reserve_penalty_spot_seed_match_distance_m: 20.0
  ball:
    ball_min_conf: 0.0035
    ball_expected_position_gate_px: 90.0
    ball_expected_position_gate_growth_per_frame: 35.0
    ball_expected_position_confidence_relax: 1.4
    ball_size_ratio_per_frame: 1.8
    ball_size_min_samples: 5
    ball_size_std_factor: 3.0
    ball_size_std_floor: 1.0
    ball_max_reassign_lost_frames: 30
    ball_high_conf_override: 0.6

positions:
  special_seed_role_team_assignment_enabled: true
  special_seed_role_model_path: "models/positions/20260427_002133/best_model.pt"
  special_seed_canonical_ids: [1, 2]
  special_seed_defender_roles: ["LD", "LI", "DFC_DER", "DFC_IZQ", "DFC_CENT"]
  expected_roles_by_team:
    Real Madrid: ["POR", "DFC_IZQ", "DFC_CENT", "DFC_DER", "LI", "LD", "MC", "MI", "MD", "DC", "DC"]
    Wolfsburgo: ["POR", "LD", "LI", "DFC_DER", "DFC_IZQ", "MC", "MC", "MI", "MD", "DC", "DC"]
  role_swap_min_recent_samples: 8
  role_swap_position_jump_m: 14.0
  segment_temporal_continuity_enabled: true
  segment_temporal_same_line_penalty: 0.35
  segment_temporal_cross_line_penalty: 1.25
  segment_temporal_same_base_penalty: 0.15
  segment_duplicate_lateral_tiebreak_enabled: true
  segment_duplicate_lateral_tiebreak_delta: 0.06

# Configuracion de equipos
teams:
  Real Madrid:
    color_lab_opencv: [255, 127, 127]
    name: "Real Madrid"
  Wolfsburgo:
    color_lab_opencv: [224, 77, 196]
    name: "Wolfsburgo"

# Configuracion de visualizacion
visualization:
  colors:
    player: [0, 255, 0]
    goalkeeper: [0, 255, 255]
    referee: [255, 0, 0]
    ball: [0, 0, 255]
  team_colors:
    Real Madrid: [240, 240, 240]
    Wolfsburgo: [0, 80, 220]
  show_kmeans: false
  show_output: true
  continuity_keep_all_seen_ids: true
  discarded_panel_show_reasons: true
  discarded_panel_color_not_tracked: [0, 165, 255]
  discarded_panel_color_tracked_no_canonical: [255, 0, 255]
  line_thickness: 2
  font_scale: 0.5
  compact_font_scale: 0.5
  pitch_marker_radius: 10

# Configuracion de fine-tuning (Pipeline secuencial)
finetuning:
  phases:
    - name: "sinteticos"
      enabled: true
      dataset: "data/detection/SoccerSynth_YOLO_2clases/data.yaml"
      epochs: 40
      batch: 8
      imgsz: 1280
      output_name: "sin_arbitro/sinteticos"

    - name: "dfl-bundesliga"
      enabled: true
      dataset: "data/detection/DFL-Bundesliga-2clases/data.yaml"
      epochs: 100
      batch: 16
      imgsz: 640
      output_name: "sin_arbitro/dfl-bundesliga"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_file: "narrador-futbol.log"
