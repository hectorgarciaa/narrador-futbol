# Configuración del sistema de narración de fútbol con IA

# Rutas de archivos y directorios (relativas a la raíz del proyecto)
paths:
  # Modelos YOLO
  models:
    yolo_base: "models/yolo/v11/yolov11m.pt"
    yolo_v8_m: "models/yolo/v8/yolov8m.pt"
    yolo_v8_x: "models/yolo/v8/yolov8x.pt"
    yolo_v11_m: "models/yolo/v11/yolov11m.pt"
    yolo_v11_x: "models/yolo/v11/yolov11x.pt"
    finetuned_player: "models/finetuning/yolov11m/weights/best.pt"
    finetuned_ball: "models/finetuning-balon/v11/yolov11m/weights/best.pt"
  
  # Datos
  data:
    video_prueba: "data/partidoPrueba/partido.mp4"
    video_prueba_ajustado: "data/partidoPrueba/partido_ajustado.mp4"
    video_prueba_corto: "data/partidoPrueba/partido_corto.mp4"
    video_prueba_medio: "data/partidoPrueba/partido_medio.mp4"

    video_08fd33: "data/partidoPrueba/08fd33_4.mp4"
    video_08fd33_medio: "data/partidoPrueba/08fd33_4_medio.mp4"
    dataset_football_ai: "data/detection/football-ai-2/data.yaml"
    dataset_football_detection: "data/detection/FootBall-Detection-2/data.yaml"
    download_detection_output: "data/detection"
  
  # Modelos descargados
  models_download:
    base_dir: "models/yolo"
    versions:
      v8: ["yolov8m", "yolov8l", "yolov8x"]
      v11: ["yolov11m", "yolov11l", "yolov11x"]

  # Salidas
  output:
    base: "output"
    videos: "output/videos"
    tracks_json: "output/tracks_json"
    timing_reports: "output/timing_reports"
    prueba_tracker: "output/pruebaTracker"
    prueba_deteccion_yolo: "output/pruebaDeteccionYolo"
    prueba_finetuning: "output/pruebaFinetuning"

# Configuración de detección
detection:
  # Umbral de confianza para detecciones generales
  conf_threshold: 0.01
  # Umbral mínimo de confianza para detección de balón
  ball_min_conf: 0.01

# Configuración de tracking (ByteTrack)
tracking:
  # Umbral de activación de tracks (mayor = más estricto, menos falsos positivos)
  track_thresh: 0.5
  # Frames que se mantiene un track perdido antes de eliminarlo
  track_buffer: 90
  # Umbral de matching IoU (mayor = requiere más solapamiento para matching)
  match_thresh: 0.945
  # Frame rate del video
  frame_rate: 25
  # Frames consecutivos mínimos para confirmar un track
  minimum_consecutive_frames: 5
  # Límite global de IDs canónicos visibles
  max_total_tracks: 25
  # Si es false, el límite por clase se aplica en reasignación final, no dentro de ByteTrack
  enforce_internal_class_limits: false
  # Límite de tracks por clase en la salida final del tracker
  max_tracks_per_class:
    player: 22
    ball: 1
    referee: 3
  # Penalización de distancia cuando el equipo detectado difiere del track
  team_mismatch_penalty: 1000.0
  # Umbral para segunda asociación (detecciones de baja confianza)
  second_match_threshold: 0.9
  # Umbral para tracks no confirmados
  unconfirmed_match_threshold: 0.8
  # Parámetros de reasignación y control de movimiento
  reassign_motion_factor: 1.0
  reassign_min_distance: 25.0
  reassign_min_samples: 3
  # Recuperación específica de árbitros
  referee_recovery_max_lost_frames: 3
  referee_recovery_max_distance: 45.0
  # Activar proyección de los jugadores al campo 2D con PnLCalib para el matching
  use_field_positions: true
  field_position_method: "pnlcalib"
  field_position_classes: ["player", "goalkeeper"]
  field_length_m: 106.0
  field_width_m: 68.0
  field_position_max_width: 1280
  field_position_bottom_offset_ratio: 0.04
  field_position_keypoint_threshold: 0.3434
  field_position_line_threshold: 0.7867
  field_position_pnl_refine: true
  field_position_temporal_blend: 0.20
  field_position_pixels_per_meter: 8
  field_position_device: null
  field_position_match_distance_gate_m: 8.0
  field_position_match_distance_weight: 0.25
  reassign_min_field_distance_m: 4.0
  # Logs de rendimiento por fase y por frame
  timing_enabled: true
  timing_log_every_n_frames: 25
  timing_save_per_frame: true
  # Penalización de distancia cuando el equipo detectado difiere del track
  team_penalty: 1000
  # Frames consecutivos con equipo distinto para confirmar cambio real
  team_switch_threshold: 5

# Configuración de equipos
teams:
  Real Madrid:
    color_rgb: [255, 127, 127]  # Color de referencia en RGB
    name: "Real Madrid"
  Wolfsburgo:
    color_rgb: [224, 77, 196]  # Color de referencia en RGB
    name: "Wolfsburgo"

# Configuración de clustering de colores
color_clustering:
  # Número de clusters para KMeans
  n_clusters: 2
  # Método de inicialización
  init: "k-means++"
  # Número de inicializaciones
  n_init: 10
  # Semilla aleatoria para reproducibilidad
  random_state: 0
  # Umbral de confirmación para colores de equipo
  confirmation_threshold: 3
  # Tolerancia de color para considerar colores similares
  color_tolerance: 25

# Configuración de visualización
visualization:
  # Colores para dibujar bounding boxes (BGR para OpenCV)
  colors:
    player: [0, 255, 0]      # Verde
    goalkeeper: [0, 255, 255] # Amarillo
    referee: [255, 0, 0]      # Azul
    ball: [0, 0, 255]         # Rojo
  
  # Configuración de visualización de KMeans
  show_kmeans: false
  # Mostrar salida en tiempo real durante procesamiento
  show_output: true
  # Grosor de las líneas de bounding boxes
  line_thickness: 2
  # Tamaño de fuente para etiquetas
  font_scale: 0.5

# Configuración de fine-tuning
finetuning:
  # Número de épocas para entrenamiento
  epochs: 50
  # Tamaño de batch
  batch: 16
  # Tamaño de imagen
  imgsz: 640

# Logging
logging:
  # Nivel de log: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  # Formato de log
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  # Archivo de log (relativo a la raíz del proyecto)
  log_file: "narrador-futbol.log"
