# Configuración del sistema de narración de fútbol con IA

# Rutas de archivos y directorios (relativas a la raíz del proyecto)
paths:
  # Modelos YOLO
  models:
    yolo_base: "models/yolo/v11/yolo11m.pt"
    
    yolo_v8_m: "models/yolo/v8/yolov8m.pt"
    yolo_v8_l: "models/yolo/v8/yolov8l.pt"
    yolo_v8_x: "models/yolo/v8/yolov8x.pt"
    
    yolo_v11_m: "models/yolo/v11/yolo11m.pt"
    yolo_v11_l: "models/yolo/v11/yolo11l.pt"
    yolo_v11_x: "models/yolo/v11/yolo11x.pt"

    modelo_base: "models/finetuning/yolov11m/weights/best.pt"
    # modelo_base: "models/finetuning/con_arbitro/dfl-bundesliga/weights/best.pt"
    finetuned_player: "models/finetuning/con_arbitro/dfl-bundesliga/weights/best.pt"
    finetuned_ball: "models/finetuning-balon/v11/yolo11m/weights/best.pt"
  
  # Datos
  data:
    video_prueba: "data/partidoPrueba/partido.mp4"
    video_prueba_ajustado: "data/partidoPrueba/partido_ajustado.mp4"
    video_prueba_corto: "data/partidoPrueba/partido_corto.mp4"
    video_prueba_medio: "data/partidoPrueba/partido_medio.mp4"

    video_08fd33: "data/partidoPrueba/08fd33_4.mp4"
    video_08fd33_medio: "data/partidoPrueba/08fd33_4_medio.mp4"

    # Clips para dataset de posiciones (data/partidosPosiciones)
    video_test_1: "data/partidosPosiciones/test (1).mp4"
    video_test_2: "data/partidosPosiciones/test (2).mp4"
    video_test_11: "data/partidosPosiciones/test (11).mp4"
    video_test_12: "data/partidosPosiciones/test (12).mp4"
    video_test_13: "data/partidosPosiciones/test (13).mp4"
    video_test_14: "data/partidosPosiciones/test (14).mp4"
    video_test_15: "data/partidosPosiciones/test (15).mp4"
    video_test_16: "data/partidosPosiciones/test (16).mp4"
    video_test_18: "data/partidosPosiciones/test (18).mp4"
    video_test_20: "data/partidosPosiciones/test (20).mp4"
    video_test_22: "data/partidosPosiciones/test (22).mp4"
    video_test_26: "data/partidosPosiciones/test (26).mp4"
    video_test_27: "data/partidosPosiciones/test (27).mp4"
    video_test_29: "data/partidosPosiciones/test (29).mp4"

    dataset_football_ai: "data/detection/football-ai-2/data.yaml"
    dataset_football_detection: "data/detection/FootBall-Detection-2/data.yaml"
    dataset_soccersynth: "data/detection/SoccerSynth/data.yaml"
    dataset_football_dfl: "data/detection/DFL-Bundesliga,-soccer,-football-1/data.yaml"
    dataset_football_dfl_2clases: "data/detection/DFL-Bundesliga-2clases/data.yaml"
    dataset_soccersynth_2clases: "data/detection/SoccerSynth_YOLO_2clases/data.yaml"

    download_detection_output: "data/detection"
  
  # Modelos descargados
  models_download:
    base_dir: "models/yolo"
    versions:
      v8: ["yolov8m"]
      v11: ["yolo11m"]

  # Salidas
  output:
    base: "output"
    videos: "output/videos"
    tracks_json: "output/tracks_json"
    role_artifacts: "output/tracker"
    prueba_tracker: "output/pruebaTracker"
    prueba_deteccion_yolo: "output/pruebaDeteccionYolo"
    prueba_finetuning: "output/pruebaFinetuning"

# Configuración de detección
detection:
  conf: 0.01              # Umbral de confianza para detecciones generales
  verbose: true          # Si true, muestra logs detallados durante la detección

# Configuración de clustering de colores
team_detector:
  min_samples: {"player": 60, "referee": 15}                 # Muestras mínimas para considerar calcular cluster
  min_size_cluster: 4             # Tamaño mínimo de cluster para considerarlo válido (evita clusters muy pequeños por outliers)
  team_colors: 
    Real Madrid: [255, 127, 127]    # Color de referencia en lab_opencv
    Wolfsburgo: [224, 77, 196]      # Color de referencia en lab_opencv
  shirt_detector_conf:
    n_clusters: 2
    init: "k-means++"
    n_init: 3
    downsample: 0.6
    random_state: 0


# Configuración de tracking (ByteTrack)
tracking:
  print_runtime_devices: true  # Si true, imprime dispositivo de PnLCalib y frame hook (cuda/cpu)
  projector:
    enabled: true     # Activar proyección de los jugadores al campo 2D con PnLCalib para el matching
    classes: ["player", "goalkeeper"]
    reassign_min_field_distance_m: 1.2
    match_distance_gate_m: 2.1
    match_distance_cap_m: 8.0
    match_distance_max_lost_frames: 10
    match_distance_growth_mode: linear_decay
    match_distance_lost_exponent: 0.5
    match_distance_decay_per_frame: 0.3

    constructor:
      field_length_m: 106.0
      field_width_m: 68.0
      max_width: 1280
      bottom_offset_ratio: 0.04
      keypoint_threshold: 0.3434
      line_threshold: 0.7867
      pnl_refine: false
      temporal_blend: 0.20
      pixels_per_meter: 8
      device: null

  bytetracker:
    track_activation_threshold: 0.05
    lost_track_buffer: 90
    minimum_matching_threshold: 0.945
    frame_rate: 25
    minimum_consecutive_frames: 5
    new_track_active_overlap_iou: 0.2
    new_track_unconfirmed_overlap_iou: 0.1
    new_track_candidate_overlap_iou: 0.0
    team_mismatch_penalty: 1000.0
    second_match_threshold: 0.9
    unconfirmed_match_threshold: 0.8
    use_field_positions: true
    field_position_classes: ["player", "goalkeeper"]
    
    field_distance_gate_m: 8.0
    field_distance_weight: 0.5
    field_distance_weight: 0.25 # 0.5
    field_distance_gate_max_lost_frames: 10
    field_distance_gate_cap_m: 8.0
    field_distance_growth_mode: linear_decay
    field_distance_lost_exponent: 0.5
    field_distance_decay_per_frame: 0.3
    lost_time_penalty_weight: 0.12  # Peso de la penalización por tiempo perdido en el coste de matching
    lost_time_penalty_max_frames: 10  # Máximo número de frames perdidos para aplicar penalización en el coste de matching
    use_field_position_as_primary_cost: false  # Si true, usa como coste principal la distancia en campo en lugar de IoU para player/goalkeeper. Recomendado si quieres usar señal visual y geométrica a la vez.
    use_bbox_center_for_matching: false  # Si true, usa BB-Overlap en lugar de IoU para el coste de matching. Recomendado para detecciones con bounding boxes muy ajustados al jugador.
    bbox_center_distance_weight: 0.7  # Peso de la distancia entre centros de bounding box en el coste de matching (si use_bbox_center_for_matching es false)
    bbox_center_distance_gate_px: 120.0  # Distancia máxima en píxeles entre centros de bounding box para considerar un match (si use_bbox_center_for_matching es false)
    class_mismatch_penalty: 1000.0  # Penalización fuerte por mismatch de clase en el matching interno
    class_mismatch_relaxed_penalty: 180.0  # Penalización reducida si clase YOLO y clase reetiquetada discrepan (permite remapeos)
    allow_class_remap_when_signals_disagree: true  # Si true, habilita la vía de remapeo cuando las dos señales de clase no coinciden
    class_vote_weight_relabel: 1.0  # Peso del voto de clase reetiquetada (TeamDetector) en el consenso por track
    class_vote_weight_yolo: 1.0  # Peso del voto de clase original YOLO en el consenso por track
    class_consensus_switch_margin: 2.0  # Ventaja mínima acumulada para permitir cambio de clase del track interno
    shirt_color_distance_weight: 0.0  # Sin efecto en matching interno (penalización LAB desactivada)
    shirt_color_distance_gate: 45.0  # Distancia LAB a partir de la cual el cambio de color deja de penalizar linealmente
    bbox_size_mismatch_penalty: 1000.0  # Penalización por cambio brusco de tamaño entre bbox previa y bbox candidata
    bbox_height_ratio_threshold: 0.50  # Penaliza si la altura cambia más de un 50%
    bbox_width_ratio_threshold: 1  # Penaliza si el ancho cambia más de un 100%
    team_vote_weight: 1.0  # Peso del voto de equipo observado en cada frame para consenso temporal por track
    team_consensus_switch_margin: 2.0  # Ventaja mínima acumulada para cambiar el equipo canónico de un track
    max_tracks_per_class:   # Límite de tracks por clase en la salida final del tracker
      goalkeeper: 2
      player: 20
      ball: 1
      referee: 3
  
  # Parámetros específicos de la lógica del balón (filtro temporal + tamaño + gates).
  # Esta sección controla la heurística de `_select_ball_candidate` y el `ball_state`.
  ball:
    ball_min_conf: 0.0035   # Umbral mínimo de confianza para detección de balón
    ball_expected_position_gate_px: 90.0  # Radio base (px) desde posición esperada para aceptar candidato
    ball_expected_position_gate_growth_per_frame: 35.0  # Crecimiento del radio por frame perdido
    ball_expected_position_confidence_relax: 1.4  # Relaja gates si la confianza es alta
    ball_size_ratio_per_frame: 1.8  # Ratio máximo de cambio de tamaño por frame
    ball_size_min_samples: 5  # Muestras mínimas para estadística de tamaño
    ball_size_std_factor: 3.0  # k sigmas para límites de tamaño
    ball_size_std_floor: 1.0  # Suelo de sigma (evita gates demasiado estrechos)
    ball_max_reassign_lost_frames: 30  # Frames máximos para considerar que el ball_state sigue activo
    ball_high_conf_override: 0.6  # Confianza alta que relaja gates/ratio

  # Heurística online de posesión (equipo y jugador portador).
  possession:
    enabled: true
    strict_control_distance_px: 60.0
    strict_control_distance_ratio_to_height: 0.65
    loose_control_distance_px: 95.0
    loose_control_distance_ratio_to_height: 1.0
    continuation_distance_px: 35.0
    immediate_opponent_switch_distance_px: 24.0
    opponent_switch_confirmation_frames: 2
    opponent_switch_window_frames: 4
    slow_ball_speed_px: 14.0
    same_player_control_speed_px: 18.0
    speed_drop_threshold_px: 8.0
    direction_change_threshold_deg: 35.0
    opponent_takeover_margin_px: 12.0
    ball_missing_release_frames: 10
    touch_timeout_frames: 90

  
  
  
  
  reassign_motion_factor: 0.75  # Factor de penalización de distancia para reasignación
  reassign_min_distance: 10.0  # Distancia mínima en metros para considerar una reasignación de ID
  reassign_min_samples: 3  # Muestras mínimas para considerar una reasign
  reassign_motion_growth_cap_frames: 12  # Máximo número de frames perdidos que se usa para extrapolar movimiento en la reasignación canónica
  motion_std_gate_enabled: true  # Gate estadístico anti-saltos de ID (distancia por frame)
  motion_std_factor: 4.0  # Factor de desviación típica para calcular el límite del gate estadístico
  motion_std_min_samples: 5  # Muestras mínimas para calcular estadísticas de movimiento
  motion_std_floor: 0.5  # Límite mínimo del gate estadístico
  referee_recovery_max_lost_frames: 3  # Máximo número de frames perdidos para intentar una recuperación específica de árbitros
  referee_recovery_max_distance: 45.0  # Distancia máxima en metros para
  referee_canonical_ids: [23, 24, 25]
  referee_sideline_band_distance_m: 3.0
  use_shirt_color_for_reassign: false  # Sin efecto en canonización (gate LAB desactivado)
  shirt_color_reassign_distance_gate: 45.0  # Distancia LAB máxima base entre color previo y actual para aceptar continuidad
  shirt_color_reassign_distance_growth_per_frame: 1.5  # Apertura del gate de color por frame perdido
  shirt_color_reassign_distance_cap: 70.0  # Tope del gate dinámico de color LAB
  strict_person_class_separation: true  # Si true, nunca mezcla player/goalkeeper en la reasignación canónica
  # Legacy: ByteTrack ya no limita internamente la creación por clase (se ignora este flag).
  # El límite por clase se aplica en la capa canónica/salida final.
  enforce_internal_class_limits: false
  require_field_position_for_reassign: true  # Si true, para clases con homografía (player/goalkeeper) NO hace fallback a píxeles. Si falta field_position, la reasignación se rechaza.
  max_reassign_lost_frames: null  # Tope opcional de frames perdidos para reasignar un ID. null/0/desactivado => un track puede reaparecer tras muchos frames.
  max_reassign_lost_frames_by_class: {}  # Sin corte por clase (legacy). Evita capar reenganches tardíos.
  forced_absorption_enabled: true  # Habilita una reabsorción forzada conservadora para huérfanos largos de ByteTrack.
  forced_absorption_player_min_lost_frames: 20  # X: frames mínimos que debe llevar perdido un canónico `player` para poder ceder su ID.
  forced_absorption_player_min_consistent_frames: 10  # Y: frames consecutivos mínimos que debe durar un raw track huérfano, con misma clase y equipo.
  profile_phases: false  # Si true, imprime tiempos por fase en cada frame (profiling)
  reserve_penalty_spot_seed_players: true  # Si true, reserva dos IDs canónicos sintéticos como `player` en los puntos de penalti.
  reserve_penalty_spot_seed_match_distance_m: 12.0  # Distancia máxima en metros desde el punto de penalti para absorber una detección real sobre cada track semilla reservado.    
  
  

  special_seed_role_team_assignment_enabled: true
  special_seed_role_model_path: "models/positions/set_transformer/20260317_211507/set_transformer_checkpoint.pt"
  special_seed_canonical_ids: [1, 2]
  special_seed_defender_roles: ["CD", "CI", "LD", "LI", "DFC_DER", "DFC_IZQ", "DFC_CENT"]
  # Once esperado por equipo para la inferencia posicional durante el tracking.
  # Si se define, el Set Transformer ajusta la asignación estable a estas plazas
  # usando Hungarian, igual que en experiments/set_transformer.ipynb.
  expected_roles_by_team:
    Real Madrid: ["POR", "LD", "LI", "DFC_DER", "DFC_IZQ", "MC", "MC", "MI", "MD", "DC", "DC"]
    Wolfsburgo: ["POR", "LD", "LI", "DFC_DER", "DFC_IZQ", "DFC_CENT", "MC", "MI", "MD", "DC", "DC"]
  # Congela un role estable por ID usando sus primeras observaciones visibles.
  # Si una clase domina pronto, se fija antes; si no, se congela al llegar a
  # esta ventana máxima de observaciones del track.
  # Estrategia para asignar las plazas de expected_roles_by_team cuando varios
  # jugadores están listos para congelarse a la vez:
  # - hungarian: optimiza el conjunto completo por probabilidad media
  # - greedy: asigna plaza a plaza por prioridad local
  # - ratio_priority: hace una foto global al llegar a role_stabilization_window_frames,
  #   transfiere roles no válidos y plazas válidas ya ocupadas a la siguiente
  #   plaza válida libre del ranking y asigna iterativamente por ratio acumulado
  #   y exige un ratio mínimo también en la plaza final elegida. Si aún quedan
  #   plazas libres, resuelve los descartes restantes con una asignación óptima.
  role_stabilization_expected_roles_assignment: "ratio_priority"
  role_stabilization_expected_roles_min_ratio: 0.60
  role_stabilization_expected_roles_min_final_ratio: 0.20
  role_stabilization_expected_roles_min_count: 300
  role_stabilization_window_frames: 600
  role_stabilization_min_observations: 600
  role_stabilization_vote_ratio: 0.7
  role_context_interpolation_max_gap_frames: 15  # Frames máximos para reutilizar la última posición visible de un canónico ausente como contexto del Set Transformer. No actualiza segmentos ni compite por slot.
  role_recent_position_window: 10  # Ventana corta en metros usada para la mediana espacial reciente del segmento al detectar swaps.
  role_recent_role_window: 20  # Ventana corta de roles crudos recientes usada para medir el rol dominante local del segmento.
  role_swap_min_recent_samples: 8  # Muestras visibles mínimas en la ventana corta antes de permitir detección de swap.
  role_swap_position_jump_m: 14.0  # Salto mínimo en metros respecto a la trayectoria reciente para sospechar swap sin señal estructural de canonización.
  role_swap_position_jump_relinked_m: 8.0  # Salto mínimo en metros si el canónico llega relinkado/reabsorbido desde otro raw tracker.
  role_swap_role_change_min_ratio: 0.60  # Dominancia mínima del rol reciente para aceptar que un cambio de rol actual contradice al segmento.
  role_swap_role_change_min_confidence: 0.35  # Confianza mínima del rol actual para usarlo como evidencia semántica de swap.

# Configuración de equipos
teams:
  Real Madrid:
    color_lab_opencv: [255, 127, 127]  # Color de referencia en lab_opencv
    name: "Real Madrid"
  Wolfsburgo:
    color_lab_opencv: [224, 77, 196]  # Color de referencia en lab_opencv
    name: "Wolfsburgo"

# Configuración de visualización
visualization:
  # Colores para dibujar bounding boxes (BGR para OpenCV)
  colors:
    player: [0, 255, 0]      # Verde
    goalkeeper: [0, 255, 255] # Amarillo
    referee: [255, 0, 0]      # Azul
    ball: [0, 0, 255]         # Rojo
  # Colores de relleno por equipo para el panel de campo (BGR).
  # Si falta un equipo, el drawer usa fallback determinista.
  team_colors:
    Real Madrid: [240, 240, 240]
    Wolfsburgo: [0, 80, 220]
  
  # Configuración de visualización de KMeans
  show_kmeans: false
  # Mostrar salida en tiempo real durante procesamiento
  show_output: true
  # Si true, renderiza salida en mosaico 2x2 con paneles de depuración.
  four_panel_enabled: true
  # Si true, en el panel D mantiene visibles todos los IDs ya observados
  # (no solo hasta el cupo esperado por clase).
  continuity_keep_all_seen_ids: true
  # Panel C (YOLO descartadas): muestra el motivo de descarte en la etiqueta.
  discarded_panel_show_reasons: true
  # Panel C (YOLO descartadas): colores BGR por tipo de descarte.
  # - not_tracked: detecciones YOLO que no fueron devueltas por ByteTrack.
  # - tracked_no_canonical: detecciones devueltas por ByteTrack pero descartadas en el mapeo canónico.
  discarded_panel_color_not_tracked: [0, 165, 255]
  discarded_panel_color_tracked_no_canonical: [255, 0, 255]
  # Grosor de las líneas de bounding boxes
  line_thickness: 2
  # Tamaño de fuente para etiquetas
  font_scale: 0.5
  # Escala de fuente usada en etiquetas compactas del modo 2x2.
  compact_font_scale: 0.5
  # Radio de los círculos en el panel 2D del campo.
  pitch_marker_radius: 10

# Configuración de fine-tuning (Pipeline secuencial)
finetuning:
  phases:
    - name: "sinteticos"
      enabled: true
      dataset: "data/detection/SoccerSynth_YOLO_2clases/data.yaml"
      epochs: 40
      batch: 8
      imgsz: 1280
      output_name: "sin_arbitro/sinteticos"
      
    - name: "dfl-bundesliga"
      enabled: true
      dataset: "data/detection/DFL-Bundesliga-2clases/data.yaml"
      epochs: 100
      batch: 16
      imgsz: 640
      output_name: "sin_arbitro/dfl-bundesliga"


# Logging
logging:
  # Nivel de log: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  # Formato de log
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  # Archivo de log (relativo a la raíz del proyecto)
  log_file: "narrador-futbol.log"
