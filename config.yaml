# Configuración del sistema de narración de fútbol con IA

# Rutas de archivos y directorios (relativas a la raíz del proyecto)
paths:
  # Modelos YOLO
  models:
    yolo_base: "models/yolo/v11/yolov11m.pt"
    yolo_v8_m: "models/yolo/v8/yolov8m.pt"
    yolo_v8_x: "models/yolo/v8/yolov8x.pt"
    yolo_v11_m: "models/yolo/v11/yolov11m.pt"
    yolo_v11_x: "models/yolo/v11/yolov11x.pt"
    finetuned_player: "models/finetuning/yolov11m/weights/best.pt"
    finetuned_ball: "models/finetuning-balon/v11/yolov11m/weights/best.pt"
  
  # Datos
  data:
    video_prueba: "data/partidoPrueba/partido.mp4"
    video_prueba_ajustado: "data/partidoPrueba/partido_ajustado.mp4"
    video_prueba_corto: "data/partidoPrueba/partido_corto.mp4"
    video_prueba_medio: "data/partidoPrueba/partido_medio.mp4"

    video_08fd33: "data/partidoPrueba/08fd33_4.mp4"
    video_08fd33_medio: "data/partidoPrueba/08fd33_4_medio.mp4"
    # Clips para dataset de posiciones (data/partidosPosiciones)
    video_test_1: "data/partidosPosiciones/test (1).mp4"
    video_test_2: "data/partidosPosiciones/test (2).mp4"
    video_test_11: "data/partidosPosiciones/test (11).mp4"
    video_test_12: "data/partidosPosiciones/test (12).mp4"
    video_test_13: "data/partidosPosiciones/test (13).mp4"
    video_test_14: "data/partidosPosiciones/test (14).mp4"
    video_test_15: "data/partidosPosiciones/test (15).mp4"
    video_test_16: "data/partidosPosiciones/test (16).mp4"
    video_test_18: "data/partidosPosiciones/test (18).mp4"
    video_test_20: "data/partidosPosiciones/test (20).mp4"
    video_test_22: "data/partidosPosiciones/test (22).mp4"
    video_test_26: "data/partidosPosiciones/test (26).mp4"
    video_test_27: "data/partidosPosiciones/test (27).mp4"
    video_test_29: "data/partidosPosiciones/test (29).mp4"
    dataset_football_ai: "data/detection/football-ai-2/data.yaml"
    dataset_football_detection: "data/detection/FootBall-Detection-2/data.yaml"
    download_detection_output: "data/detection"
  
  # Modelos descargados
  models_download:
    base_dir: "models/yolo"
    versions:
      v8: ["yolov8m", "yolov8l", "yolov8x"]
      v11: ["yolov11m", "yolov11l", "yolov11x"]

  # Salidas
  output:
    base: "output"
    videos: "output/videos"
    tracks_json: "output/tracks_json"
    prueba_tracker: "output/pruebaTracker"
    prueba_deteccion_yolo: "output/pruebaDeteccionYolo"
    prueba_finetuning: "output/pruebaFinetuning"

# Configuración de detección
detection:
  # Umbral de confianza para detecciones generales
  conf_threshold: 0.01
  # Umbral mínimo de confianza para detección de balón
  ball_min_conf: 0.005

# Configuración de tracking (ByteTrack)
tracking:
  # Umbral de activación de tracks (mayor = más estricto, menos falsos positivos)
  track_thresh: 0.15
  # Frames que se mantiene un track perdido antes de eliminarlo
  track_buffer: 90
  # Umbral de matching IoU (mayor = requiere más solapamiento para matching)
  match_thresh: 0.945
  # Frame rate del video
  frame_rate: 25
  # Frames consecutivos mínimos para confirmar un track
  minimum_consecutive_frames: 5
  # Límite global de IDs canónicos visibles
  max_total_tracks: 25
  # Si es false, el límite por clase se aplica en reasignación final, no dentro de ByteTrack
  enforce_internal_class_limits: false
  # Límite de tracks por clase en la salida final del tracker
  max_tracks_per_class:
    player: 22
    ball: 1
    referee: 3
  # Penalización de distancia cuando el equipo detectado difiere del track
  team_mismatch_penalty: 1000.0
  # Modo de asignación de equipo por color:
  # - reference: usa colores de teams (config.yaml/--team-colors) y ajuste adaptativo.
  # - auto-bootstrap: aprende 2 clusters al inicio del vídeo y fija la mediana de cada uno para todo el run.
  team_assignment_mode: reference
  # Frames iniciales para bootstrap en modo auto-bootstrap.
  # 1 = usa el primer frame, valores 10-30 suelen ser más robustos.
  team_bootstrap_frames: 1
  # Muestras mínimas de color para cerrar bootstrap.
  team_bootstrap_min_samples: 12
  # Número de equipos/clusters a separar en auto-bootstrap (dataset partido normal = 2).
  team_bootstrap_num_teams: 2
  # Tamaño mínimo por cluster en bootstrap (4 => obliga a >3 nodos por cluster).
  # Si sale un cluster <=3, se re-clusteriza sobre el cluster grande.
  team_bootstrap_min_cluster_samples: 4
  # Prefijo para los nombres automáticos (ej. "Equipo 1", "Equipo 2").
  team_auto_name_prefix: "Equipo"
  # Clases que participan en la detección de color de equipo.
  team_candidate_classes: ["player", "goalkeeper"]
  # Umbral para segunda asociación (detecciones de baja confianza)
  second_match_threshold: 0.9
  # Umbral para tracks no confirmados
  unconfirmed_match_threshold: 0.8
  # Parámetros de reasignación y control de movimiento
  reassign_motion_factor: 0.75
  reassign_min_distance: 10.0
  reassign_min_samples: 3
  # Matching de ByteTrack para player/goalkeeper:
  # - false: combina IoU + penalización por distancia en campo (recomendado si
  #   quieres usar señal visual y geométrica a la vez).
  # - true: usa como coste principal la distancia en campo.
  use_field_position_as_primary_cost: false
  use_bbox_center_for_matching: false
  bbox_center_distance_weight: 0.7
  bbox_center_distance_gate_px: 120.0
  # Prioriza tracks más recientes en matching (penaliza IDs más tiempo perdidos)
  lost_time_penalty_weight: 0.12
  lost_time_penalty_max_frames: 10
  # Si true, nunca mezcla player/goalkeeper en la reasignación canónica
  strict_person_class_separation: true
  # Si true, para clases con homografía (player/goalkeeper) NO hace fallback a píxeles.
  # Si falta field_position, la reasignación se rechaza.
  require_field_position_for_reassign: true
  # Límite opcional de frames perdidos para reasignar un ID.
  # null/0/desactivado => un track puede reaparecer tras muchos frames.
  max_reassign_lost_frames: null
  max_reassign_lost_frames_by_class: {}
  # Gate estadístico anti-saltos de ID (distancia por frame)
  # límite = media_historica + motion_std_factor * desviacion_tipica
  motion_std_gate_enabled: true
  motion_std_factor: 4.0
  motion_std_min_samples: 5
  motion_std_floor: 0.5
  # Restricciones específicas del balón en imagen:
  # - posición esperada según la trayectoria reciente
  # - cambio de tamaño acotado entre frames
  ball_expected_position_gate_px: 90.0
  ball_expected_position_gate_growth_per_frame: 35.0
  ball_expected_position_confidence_relax: 1.4
  ball_size_ratio_per_frame: 1.8
  ball_size_min_samples: 5
  ball_size_std_factor: 3.0
  ball_size_std_floor: 1.0
  ball_max_reassign_lost_frames: 4
  ball_high_conf_override: 0.6
  # Recuperación específica de árbitros
  referee_recovery_max_lost_frames: 3
  referee_recovery_max_distance: 45.0
  # Activar proyección de los jugadores al campo 2D con PnLCalib para el matching
  use_field_positions: true
  field_position_method: "pnlcalib"
  field_position_classes: ["player", "goalkeeper"]
  field_length_m: 106.0
  field_width_m: 68.0
  field_position_max_width: 1280
  field_position_bottom_offset_ratio: 0.04
  field_position_keypoint_threshold: 0.3434
  field_position_line_threshold: 0.7867
  field_position_pnl_refine: true
  field_position_temporal_blend: 0.20
  field_position_pixels_per_meter: 8
  field_position_device: null
  field_position_match_distance_gate_m: 1.5
  # Tope absoluto del radio de matching en campo (metros), incluso con acumulación por frames perdidos
  field_position_match_distance_cap_m: 6.0
  # Gate espacial en campo para matching:
  # Modo linear_decay:
  #   distancia_max = sum_{k=0..lost-1} max(gate_m - k*decay_per_frame, 0)
  # y se satura con max_lost_frames. Ejemplo: 2.0, 1.9, 1.8, ...
  field_position_match_distance_max_lost_frames: 10
  field_position_match_distance_growth_mode: linear_decay
  field_position_match_distance_lost_exponent: 0.5
  field_position_match_distance_decay_per_frame: 0.5
  field_position_match_distance_weight: 0.25
  reassign_min_field_distance_m: 1.2
  # Penalización de distancia cuando el equipo detectado difiere del track
  team_penalty: 1000
  # Frames consecutivos con equipo distinto para confirmar cambio real
  team_switch_threshold: 5

# Configuración de equipos
teams:
  Real Madrid:
    color_lab_opencv: [255, 127, 127]  # Color de referencia en lab_opencv
    name: "Real Madrid"
  Wolfsburgo:
    color_lab_opencv: [224, 77, 196]  # Color de referencia en lab_opencv
    name: "Wolfsburgo"

# Configuración de clustering de colores
color_clustering:
  # Número de clusters para KMeans
  n_clusters: 2
  # Método de inicialización
  init: "k-means++"
  # Número de inicializaciones
  n_init: 10
  # Semilla aleatoria para reproducibilidad
  random_state: 0
  # Umbral de confirmación para colores de equipo
  confirmation_threshold: 3
  # Tolerancia de color para considerar colores similares
  color_tolerance: 25

# Configuración de visualización
visualization:
  # Colores para dibujar bounding boxes (BGR para OpenCV)
  colors:
    player: [0, 255, 0]      # Verde
    goalkeeper: [0, 255, 255] # Amarillo
    referee: [255, 0, 0]      # Azul
    ball: [0, 0, 255]         # Rojo
  
  # Configuración de visualización de KMeans
  show_kmeans: false
  # Mostrar salida en tiempo real durante procesamiento
  show_output: true
  # Grosor de las líneas de bounding boxes
  line_thickness: 2
  # Tamaño de fuente para etiquetas
  font_scale: 0.5

# Configuración de fine-tuning
finetuning:
  # Número de épocas para entrenamiento
  epochs: 50
  # Tamaño de batch
  batch: 16
  # Tamaño de imagen
  imgsz: 640

# Logging
logging:
  # Nivel de log: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  # Formato de log
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  # Archivo de log (relativo a la raíz del proyecto)
  log_file: "narrador-futbol.log"
