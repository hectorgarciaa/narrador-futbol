[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-ai"
version = "0.1.0"
description = "AI Football Commentator - Sistema de narración de fútbol con IA"
requires-python = ">=3.8"
dependencies = [
    "ultralytics>=8.2.0",
    "supervision>=0.18.0",
    "opencv-python>=4.9.0.80",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "roboflow>=1.1.28",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
include = ["football_ai*"]
